name: Build Mac app

# Runs on GitHub's own Mac servers, so nobody needs a Mac or Xcode to publish a release.
#  - Every push / pull request: runs the tests and builds the app (download it from the run's "Artifacts").
#  - Pushing a tag like v1.0.0: also publishes the .dmg files on the Releases page.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the .dmg files to a Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon (M1/M2/M3/M4)
            label: apple-silicon
          - os: macos-15-intel      # Intel Macs
            label: intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python tests/smoke_test.py

      - name: Build app and .dmg
        run: bash packaging/build_mac.sh ${{ matrix.label }}

      - name: Check the built app starts
        run: |
          QT_QPA_PLATFORM=offscreen "dist/PDF Shrink.app/Contents/MacOS/PDF Shrink" &
          APP_PID=$!
          sleep 10
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "App started and stayed running"
            kill "$APP_PID"
          else
            echo "App exited early"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Shrink-${{ matrix.label }}
          path: dist/PDF-Shrink-${{ matrix.label }}.dmg

      - name: Publish to Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PDF-Shrink-${{ matrix.label }}.dmg
          generate_release_notes: true
